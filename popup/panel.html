<!DOCTYPE html>

<html>
<head>
	<meta charset="utf-8">
	<link rel="stylesheet" href="/popup/panel.css"/>

	<style>
		/* Estilo general del input similar a Bootstrap */
        .input-estilizado {
            display: block;
            width: 100%; /* Ocupa todo el ancho disponible (puedes cambiarlo a px o rem) */
            padding: 0.375rem 0.75rem; /* Espaciado interno (alto y ancho) */
            font-size: 1rem; /* Tamaño de fuente */
            font-weight: 400;
            line-height: 1.5;
            color: #212529;
            background-color: #fff;
            background-clip: padding-box;
            border: 1px solid #ced4da; /* Borde sutil */
            appearance: none;
            border-radius: 0.375rem; /* Esquinas redondeadas */
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
            box-sizing: border-box; /* Asegura que el padding no rompa el ancho */
        }

        /* Efecto al hacer clic (Focus) idéntico al de Bootstrap */
        .input-estilizado:focus {
            color: #212529;
            background-color: #fff;
            border-color: #86b7fe;
            outline: 0;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }
	</style>
</head>

<body>
    <div class="searchbar">
        <input type="text" class="input-estilizado" name="" id="search" placeholder="Search the tabs (press / to search)">
    </div>
	<div class="group" id="tabs"></div>

	<nav id="context-menu" class="context-menu">
		<ul class="context-menu__items">
		  <li class="context-menu__item">
			<span class="context-menu__link" data-action="viewurl"> View URL/Title</span>
		  </li>
		  <li class="context-menu__item">
			<span class="context-menu__link" data-action="bookmark"> Bookmark</span>
		  </li>
		  <li class="context-menu__item">
			<span class="context-menu__link" data-action="pin"> Pin</span>
		  </li>
		  <li class="context-menu__item">
			<span class="context-menu__link" data-action="discard"> Discard</span>
		  </li>
		  <li class="context-menu__item">
			<span class="context-menu__link" data-action="reload"> Reload</span>
		  </li>
		  <li class="context-menu__item">
			<span class="context-menu__link" data-action="remove"> Close</span>
		  </li>
		</ul>
	</nav>
	
    <script src="/popup/panel.js"></script>
</body>

</html>
